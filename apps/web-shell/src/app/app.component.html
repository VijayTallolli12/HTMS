<div class="app-layout">
  <!-- Top Global Header -->
  <header class="app-header">
    <div class="brand-area">
      <div class="brand-mark">HMS</div>
      <div class="brand-info">
        <span class="brand-name">ENTERPRISE HMS</span>
        <span class="brand-sub">Hospitality Operating Platform</span>
      </div>
    </div>

    <div class="header-center">
      <nav class="header-nav">
        <a routerLink="/health" routerLinkActive="active-nav" class="nav-link">System Status</a>
        <a routerLink="/organization" routerLinkActive="active-nav" class="nav-link"
          >Organization</a
        >
      </nav>

      <div class="property-selector">
        <span class="selector-label">ACTIVE CONTEXT</span>
        <span class="selector-value" *ngIf="activeProperty()">
          🏨 {{ activeProperty()!.name }} ({{ activeProperty()!.code }})
        </span>
        <span class="selector-value" *ngIf="!activeProperty()">
          🌐 Portfolio Master (All Properties)
        </span>
      </div>
    </div>

    <div class="header-right">
      <span class="env-tag">DEVELOPMENT</span>
      <div class="user-profile">
        <div class="user-avatar">SA</div>
        <div class="user-details">
          <span class="user-name">System Administrator</span>
          <span class="user-role">Platform Lead</span>
        </div>
      </div>
    </div>
  </header>

  <!-- Main View Area -->
  <main class="app-main">
    <router-outlet></router-outlet>
  </main>
</div>
