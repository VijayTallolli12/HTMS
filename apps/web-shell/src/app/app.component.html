<!-- Authenticated Shell: Topbar + Left Sidebar + Main Content -->
<div class="hms-app-layout" *ngIf="isAuthenticated()">
  <!-- Slim, Compact Enterprise Topbar (60px Desktop / 56px Mobile) -->
  <header class="hms-topbar">
    <div class="hms-topbar__left">
      <!-- Sidebar Collapse / Mobile Drawer Hamburger Toggle Button -->
      <button
        type="button"
        class="hms-sidebar-toggle-btn"
        (click)="toggleSidebar()"
        [title]="isSidebarCollapsed() ? 'Expand sidebar navigation' : 'Collapse sidebar navigation'"
        [attr.aria-label]="isSidebarCollapsed() ? 'Expand sidebar navigation' : 'Collapse sidebar navigation'"
        [attr.aria-expanded]="!isSidebarCollapsed()"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="toggle-svg" aria-hidden="true">
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <!-- Brand Mark & Identity Lockup -->
      <div class="hms-topbar__brand" routerLink="/dashboard" [title]="branding.applicationName() + ' Dashboard'">
        <hms-brand-logo variant="full" size="sm"></hms-brand-logo>
      </div>
    </div>

    <!-- Center Context: Clean Contextual Workspace Context (Vertically Centered Workspace Title) -->
    <div class="hms-topbar__center">
      <span class="workspace-title" aria-current="page">{{ currentWorkspaceLabel }}</span>
    </div>

    <!-- Right Controls: Hierarchy: [Property Selector] -> [User Menu] -> [Sign Out] -->
    <div class="hms-topbar__right">
      <!-- 1. Property Selector: Primary Right-side Control with Clear Hierarchy -->
      <hms-property-selector
        *ngIf="properties().length > 0 || activeProperty()"
        [properties]="properties()"
        [activeProperty]="activeProperty()"
        (propertyChange)="onPropertyChange($event)"
      ></hms-property-selector>

      <!-- 3. User Area: Unenclosed, Natural Clickable Stack with Avatar & Chevron -->
      <div class="user-menu-wrapper">
        <button
          type="button"
          class="user-profile-trigger"
          (click)="toggleUserMenu()"
          [attr.aria-expanded]="isUserMenuOpen()"
          aria-haspopup="true"
          aria-label="User Account Menu"
        >
          <div class="user-avatar" aria-hidden="true">
            {{ userInitials }}
          </div>
          <div class="user-meta">
            <span class="user-full-name">{{ userDisplayName }}</span>
            <span class="user-role-label">{{ primaryRole }}</span>
          </div>
          <svg class="user-chevron-svg" [class.is-open]="isUserMenuOpen()" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M6 8l4 4 4-4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <!-- Dropdown Menu Overlay -->
        <div class="user-dropdown-card" *ngIf="isUserMenuOpen()" role="menu">
          <div class="dropdown-header-top">
            <div class="user-avatar-lg" aria-hidden="true">{{ userInitials }}</div>
            <div class="dropdown-identity">
              <div class="dropdown-name">{{ userDisplayName }}</div>
              <div class="dropdown-email">{{ currentUser()?.email }}</div>
              <div class="dropdown-role-tag">{{ primaryRole }}</div>
            </div>
          </div>

          <div class="dropdown-divider"></div>

          <!-- Two-Column Structured Metadata Grid -->
          <div class="dropdown-meta-grid">
            <span class="meta-label">Property Context:</span>
            <span class="meta-value">{{ activeProperty()?.name || 'Tokyo Grandeur Palace' }}</span>
            <span class="meta-label">Property Code:</span>
            <span class="meta-value font-mono">{{ activeProperty()?.code || 'TGP-01' }}</span>
            <span class="meta-label">System Tier:</span>
            <span class="meta-value">Enterprise Luxury</span>
          </div>

          <div class="dropdown-divider"></div>

          <a routerLink="/settings" class="dropdown-settings-link" (click)="toggleUserMenu()" role="menuitem">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="link-svg" aria-hidden="true">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            <span>Appearance &amp; Settings</span>
          </a>

          <button type="button" class="dropdown-signout-btn" (click)="onLogout()" role="menuitem">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="signout-svg" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>Sign Out</span>
          </button>
        </div>
      </div>

      <!-- 4. Logout Action: Square Neutral Border, Monochrome SVG, Subtle Danger Hover -->
      <button
        type="button"
        class="logout-btn"
        (click)="onLogout()"
        title="Sign Out"
        aria-label="Sign Out"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="logout-svg" aria-hidden="true">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
      </button>
    </div>
  </header>

  <!-- Shell Body: Left Sidebar + Main Content -->
  <div class="hms-shell-body">
    <!-- Left Sidebar (Desktop expanded/collapsed + Mobile overlay drawer) -->
    <aside
      class="hms-sidebar-aside"
      [class.is-collapsed]="isSidebarCollapsed()"
      [class.mobile-open]="isMobileNavOpen()"
      aria-label="Workspace Navigation"
    >
      <hms-sidebar
        [isCollapsed]="isSidebarCollapsed()"
        (collapseToggle)="toggleSidebar()"
        (navItemClick)="closeMobileNav()"
      ></hms-sidebar>
    </aside>

    <!-- Mobile Drawer Backdrop -->
    <div
      class="hms-mobile-backdrop"
      *ngIf="isMobileNavOpen()"
      (click)="closeMobileNav()"
      aria-hidden="true"
    ></div>

    <!-- Main Workspace Content with Router Outlet -->
    <main class="hms-main-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>

<!-- Non-Authenticated Shell (e.g. /login page) -->
<main class="hms-unauth-root" *ngIf="!isAuthenticated()">
  <router-outlet></router-outlet>
</main>
